[project]
name = "inkscape-mcp"
version = "0.1.0"
description = "MCP server for Inkscape 1.4.2 — AI-assisted SVG creation, editing, query, and export"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests requiring real Inkscape binary",
    "slow: slow tests",
]
